<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Instrument Sans','Segoe UI',system-ui,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0F1F1C"/></marker></defs>
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <rect x="236" y="60" width="716" height="500" rx="16" fill="#F4F7F6" stroke="#62D2B0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="258" y="92" font-size="17" font-weight="600" fill="#0B6B57">One machine. Nothing leaves it. Ports open to localhost only.</text>
  <g font-size="19" font-weight="700" fill="#0F1F1C" text-anchor="middle">
    <rect x="30" y="150" width="160" height="80" rx="10" fill="#fff" stroke="#0F1F1C" stroke-width="2"/><text x="110" y="186">Requester</text>
    <rect x="30" y="390" width="160" height="80" rx="10" fill="#fff" stroke="#0F1F1C" stroke-width="2"/><text x="110" y="426">Reviewer</text>
    <rect x="270" y="130" width="220" height="360" rx="10" fill="#fff" stroke="#0F1F1C" stroke-width="2"/><text x="380" y="166">Review app</text>
    <rect x="560" y="130" width="180" height="150" rx="10" fill="#fff" stroke="#0F1F1C" stroke-width="2"/><text x="650" y="166">n8n workflow</text>
    <rect x="800" y="130" width="130" height="150" rx="10" fill="#fff" stroke="#0F1F1C" stroke-width="2"/><text x="865" y="166">Ollama</text>
    <rect x="990" y="320" width="190" height="70" rx="10" fill="#DDF1EA" stroke="#0B6B57" stroke-width="2"/><text x="1085" y="351" font-size="17">Confirmed</text>
    <rect x="990" y="420" width="190" height="70" rx="10" fill="#fff" stroke="#0F1F1C" stroke-width="2"/><text x="1085" y="451" font-size="17">Audit log</text>
  </g>
  <g font-size="15" fill="#56655F" text-anchor="middle">
    <text x="110" y="210">submits a request</text><text x="110" y="450">accept, edit, reject</text>
    <text x="380" y="192">form, checks, storage</text>
    <text x="650" y="192">three steps</text><text x="650" y="222">1 extract</text><text x="650" y="244">2 summarise</text><text x="650" y="266">3 draft update</text>
    <text x="865" y="192">local model</text><text x="865" y="222">Qwen2.5 7B</text>
    <text x="1085" y="374">project record</text><text x="1085" y="474">append-only</text>
  </g>
  <g>
    <rect x="290" y="300" width="180" height="76" rx="8" fill="#FBEED2"/><text x="380" y="330" font-size="16" font-weight="700" fill="#7A4E00" text-anchor="middle">AI output: pending</text><text x="380" y="354" font-size="14" fill="#7A4E00" text-anchor="middle">labelled stated / suggested</text>
    <rect x="290" y="396" width="180" height="76" rx="8" fill="#DDF1EA"/><text x="380" y="426" font-size="16" font-weight="700" fill="#0B6B57" text-anchor="middle">Human decision</text><text x="380" y="450" font-size="14" fill="#0B6B57" text-anchor="middle">required for every item</text>
  </g>
  <g fill="none" stroke="#0F1F1C" stroke-width="2" marker-end="url(#a)">
    <path d="M190 190H266"/><path d="M490 180H556"/><path d="M740 190H796"/><path d="M796 240H744"/>
    <path d="M650 280V338H474"/><path d="M190 434H286"/><path d="M470 434H720V355H986"/><path d="M720 434V455H986"/>
