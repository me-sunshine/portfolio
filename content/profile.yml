about: |
  I bring five years of experience managing operations and large-scale programmes, mostly in the non-profit and professional-services sectors. I have owned delivery end to end: planning, timelines, logistics, reporting and the stakeholder relationships that hold a programme together.

  I am now pursuing an MBA in IT Management in Berlin and moving into technology project delivery. My interest is in automation, process optimisation and applying AI to real operational work, with clear requirements, measured results and a person accountable for every decision.

  I started as a mechanical engineer, so I am comfortable with technical detail. What I add is the habit of asking what the business actually needs before choosing a tool.
objectives:
  - Technology project and programme management roles in Berlin, in English-speaking teams.
  - Projects where AI and automation are introduced into day-to-day business operations.
  - Work that pairs delivery responsibility with business analysis and stakeholder management.
